version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - affective-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - WHISPER_MODEL=base
      - WHISPER_DEVICE=cpu
      - DEEPFACE_BACKEND=opencv
      - FRAME_SAMPLE_RATE=10
      # Ollama configuration - use host.docker.internal to access host machine
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - OLLAMA_MODEL=llama3.2
      - OLLAMA_TIMEOUT=120.0
    volumes:
      - ./backend:/app
      - ./backend/uploads:/app/uploads
      - ./backend/temp:/app/temp
      # Persist model caches to avoid re-downloading
      - whisper-models:/root/.cache/whisper
      - deepface-models:/root/.deepface
      - modelscope-models:/root/.cache/modelscope
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - affective-network

networks:
  affective-network:
    driver: bridge

volumes:
  whisper-models:
  deepface-models:
  modelscope-models:
